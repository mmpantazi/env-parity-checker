[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envparity"
version = "0.1.0"
description = "Find missing, unused, mistyped or inconsistent environment variables across .env.example, docker-compose, GitHub Actions and Kubernetes before you deploy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
envparity = "envparity.cli:main"

[tool.setuptools]
packages = ["envparity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
