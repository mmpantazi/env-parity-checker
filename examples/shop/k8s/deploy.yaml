apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          image: shop:1
          env:
            - name: PORT
              value: 8080
            - name: DATABSE_URL
              valueFrom:
                secretKeyRef: {name: db, key: url}
            - name: SMTP_TIMEOUT
              value: "soon"
            - name: REDIS_URL
              value: "redis:6379"
            - name: GREETING
              value: "$(NAME) there"
            - name: NAME
              value: world
            - name: JWT_SECRET
              value: hunter2
            - name: APP_MODE
              valueFrom:
                configMapKeyRef: {name: app-config, key: mode}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  level: info
